name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # dist/ is not tracked, the dist tests and the Node import test need it
      - run: npm run build
      - run: npm test
      - run: npm run test:dist
      - run: npm run test:node
      - run: npm run test:types
