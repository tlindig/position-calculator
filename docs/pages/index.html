<h2 id="what-it-does">What it does</h2>
<p>
    You give <code>PositionCalculator</code> an <em>item</em>, usually a <em>target</em> and optionally a
    <em>boundary</em>. It measures them and returns how far the item has to move. It does not move anything itself.
</p>
